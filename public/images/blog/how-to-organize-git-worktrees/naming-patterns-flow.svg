<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="np-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="np-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182030"/>
      <stop offset="100%" stop-color="#101522"/>
    </linearGradient>
    <linearGradient id="np-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3758f9"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#np-bg)" stroke="#1e2738" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="960" height="48" rx="16" fill="#131926" stroke="#1e2738" stroke-width="1"/>
  <rect x="0" y="32" width="960" height="16" fill="#131926"/>
  <circle cx="24" cy="24" r="5" fill="#ef4444"/>
  <circle cx="42" cy="24" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="24" r="5" fill="#10b981"/>
  <text x="480" y="29" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.04em">WORKTREEWISE NAMING PATTERN TRANSFORMATION PIPELINE</text>

  <!-- Left: Inputs -->
  <g transform="translate(36, 75)">
    <rect width="250" height="365" rx="12" fill="url(#np-card)" stroke="#26334d" stroke-width="1.2"/>
    <rect x="16" y="16" width="218" height="32" rx="6" fill="#3758f9" fill-opacity="0.12"/>
    <text x="26" y="36" fill="#60a5fa" font-size="13" font-weight="700">1. INPUT VARIABLES</text>

    <!-- Variable 1: {repo} -->
    <g transform="translate(16, 64)">
      <rect width="218" height="72" rx="8" fill="#0b0f17" stroke="#1f293d" stroke-width="1"/>
      <rect x="12" y="10" width="60" height="20" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="42" y="24" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">{repo}</text>
      <text x="80" y="24" fill="#94a3b8" font-size="11">Repository Name</text>
      <text x="14" y="52" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="600">"acme-commerce"</text>
    </g>

    <!-- Variable 2: {branch} -->
    <g transform="translate(16, 150)">
      <rect width="218" height="100" rx="8" fill="#0b0f17" stroke="#1f293d" stroke-width="1"/>
      <rect x="12" y="10" width="70" height="20" rx="4" fill="#a855f7" fill-opacity="0.2"/>
      <text x="47" y="24" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">{branch}</text>
      <text x="90" y="24" fill="#94a3b8" font-size="11">Active Branch</text>
      <text x="14" y="50" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="12">"feat/auth-v2"</text>
      <path d="M 14 62 L 14 74 L 28 74" stroke="#475569" stroke-width="1.2" fill="none"/>
      <text x="34" y="78" fill="#eab308" font-family="ui-monospace, monospace" font-size="11">Auto-sanitizes slashes</text>
    </g>

    <!-- Sanitization Note -->
    <rect x="16" y="265" width="218" height="80" rx="8" fill="#131d2e" stroke="#253552" stroke-width="1"/>
    <text x="26" y="286" fill="#38bdf8" font-size="11.5" font-weight="700">OS Filesystem Guard</text>
    <text x="26" y="306" fill="#94a3b8" font-size="11">Replaces illegal chars (/, \, :)</text>
    <text x="26" y="322" fill="#94a3b8" font-size="11">with safe, portable hyphens</text>
  </g>

  <!-- Middle: Engine Connector -->
  <g transform="translate(300, 220)">
    <path d="M 0 35 L 45 35" stroke="#3758f9" stroke-width="3" fill="none"/>
    <polygon points="45,30 55,35 45,40" fill="#3758f9"/>
    <text x="26" y="20" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">TRANSFORM</text>
  </g>

  <!-- Right: Built-in Presets -->
  <g transform="translate(365, 75)">
    <rect width="560" height="365" rx="12" fill="url(#np-card)" stroke="#26334d" stroke-width="1.2"/>
    <rect x="18" y="16" width="524" height="32" rx="6" fill="#3758f9" fill-opacity="0.12"/>
    <text x="30" y="36" fill="#60a5fa" font-size="13" font-weight="700">2. BUILT-IN NAMING PRESETS &amp; GENERATED PHYSICAL PATHS</text>

    <!-- Preset 1: Default -->
    <g transform="translate(18, 58)">
      <rect width="524" height="64" rx="8" fill="#0d1424" stroke="#3758f9" stroke-width="1.5"/>
      <rect x="14" y="10" width="84" height="20" rx="10" fill="#3758f9"/>
      <text x="56" y="24" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">DEFAULT</text>
      <text x="108" y="24" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="12">{repo}__wt__{branch}</text>
      
      <text x="14" y="48" fill="#4ade80" font-family="ui-monospace, monospace" font-size="12.5" font-weight="600">acme-commerce__wt__feat-auth-v2/</text>
      <text x="390" y="48" fill="#64748b" font-size="11">Zero collision risk</text>
    </g>

    <!-- Preset 2: Compact -->
    <g transform="translate(18, 132)">
      <rect width="524" height="64" rx="8" fill="#0b0f17" stroke="#1f293d" stroke-width="1"/>
      <rect x="14" y="10" width="84" height="20" rx="10" fill="#1e293b"/>
      <text x="56" y="24" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">COMPACT</text>
      <text x="108" y="24" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="12">{repo}__{branch}</text>
      
      <text x="14" y="48" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12.5" font-weight="600">acme-commerce__feat-auth-v2/</text>
      <text x="390" y="48" fill="#64748b" font-size="11">Short, distinct</text>
    </g>

    <!-- Preset 3: Hyphenated -->
    <g transform="translate(18, 206)">
      <rect width="524" height="64" rx="8" fill="#0b0f17" stroke="#1f293d" stroke-width="1"/>
      <rect x="14" y="10" width="84" height="20" rx="10" fill="#1e293b"/>
      <text x="56" y="24" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">HYPHEN</text>
      <text x="108" y="24" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="12">{repo}-wt-{branch}</text>
      
      <text x="14" y="48" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12.5">acme-commerce-wt-feat-auth-v2/</text>
      <text x="390" y="48" fill="#64748b" font-size="11">Kebab-case friendly</text>
    </g>

    <!-- Preset 4: Prefix -->
    <g transform="translate(18, 280)">
      <rect width="524" height="64" rx="8" fill="#0b0f17" stroke="#1f293d" stroke-width="1"/>
      <rect x="14" y="10" width="84" height="20" rx="10" fill="#1e293b"/>
      <text x="56" y="24" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">PREFIX</text>
      <text x="108" y="24" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="12">wt__{repo}__{branch}</text>
      
      <text x="14" y="48" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12.5">wt__acme-commerce__feat-auth-v2/</text>
      <text x="390" y="48" fill="#64748b" font-size="11">Alphabetical grouping</text>
    </g>
  </g>
</svg>
