<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="sc-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182030"/>
      <stop offset="100%" stop-color="#111622"/>
    </linearGradient>
    <linearGradient id="sc-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3758f9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="sc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3758f9" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#sc-bg)" stroke="#1e2738" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="960" height="48" rx="16" fill="#131926" stroke="#1e2738" stroke-width="1"/>
  <rect x="0" y="32" width="960" height="16" fill="#131926"/>
  <circle cx="24" cy="24" r="5" fill="#ef4444"/>
  <circle cx="42" cy="24" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="24" r="5" fill="#10b981"/>
  <text x="480" y="29" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.04em">GIT WORKTREE FOLDER ARCHITECTURES COMPARED</text>

  <!-- Card 1: Sibling Folder -->
  <g transform="translate(32, 72)">
    <rect width="280" height="376" rx="12" fill="url(#sc-card)" stroke="#26334d" stroke-width="1"/>
    <rect x="16" y="16" width="248" height="34" rx="6" fill="#3758f9" fill-opacity="0.12" stroke="#3758f9" stroke-opacity="0.3"/>
    <text x="28" y="38" fill="#60a5fa" font-size="13" font-weight="700">1. Sibling Layout</text>
    <rect x="180" y="23" width="76" height="20" rx="10" fill="#22c55e" fill-opacity="0.15"/>
    <text x="218" y="37" fill="#4ade80" font-size="10.5" font-weight="600" text-anchor="middle">Solo Devs</text>

    <!-- Tree View -->
    <g transform="translate(20, 68)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <rect x="0" y="0" width="240" height="215" rx="8" fill="#0b0f17" stroke="#1f2937" stroke-width="1"/>
      
      <text x="16" y="26" fill="#cbd5e1">projects/</text>
      <path d="M 24 34 L 24 185" stroke="#334155" stroke-width="1.2" fill="none"/>

      <!-- Items -->
      <path d="M 24 50 L 40 50" stroke="#334155" stroke-width="1.2"/>
      <circle cx="48" cy="50" r="3.5" fill="#3b82f6"/>
      <text x="58" y="54" fill="#38bdf8" font-weight="600">my-app/</text>
      <text x="126" y="54" fill="#64748b" font-size="10">(main .git)</text>

      <path d="M 24 95 L 40 95" stroke="#334155" stroke-width="1.2"/>
      <circle cx="48" cy="95" r="3.5" fill="#a855f7"/>
      <text x="58" y="99" fill="#e2e8f0">my-app-auth/</text>
      <text x="60" y="113" fill="#64748b" font-size="9.5">branch: feature/auth</text>

      <path d="M 24 140 L 40 140" stroke="#334155" stroke-width="1.2"/>
      <circle cx="48" cy="140" r="3.5" fill="#f59e0b"/>
      <text x="58" y="144" fill="#e2e8f0">my-app-fix-pay/</text>
      <text x="60" y="158" fill="#64748b" font-size="9.5">branch: fix/pay-err</text>

      <path d="M 24 185 L 40 185" stroke="#334155" stroke-width="1.2"/>
      <circle cx="48" cy="185" r="3.5" fill="#10b981"/>
      <text x="58" y="189" fill="#e2e8f0">my-app-exp/</text>
    </g>

    <!-- Pros & Cons Badge -->
    <g transform="translate(20, 298)">
      <text x="0" y="16" fill="#4ade80" font-size="11" font-weight="600">✓ Simplest CLI paths (../)</text>
      <text x="0" y="36" fill="#4ade80" font-size="11" font-weight="600">✓ No repo nesting confusion</text>
      <text x="0" y="56" fill="#f87171" font-size="11" font-weight="500">✗ Clutters parent folder</text>
    </g>
  </g>

  <!-- Card 2: Repository-Centric -->
  <g transform="translate(340, 72)">
    <rect width="280" height="376" rx="12" fill="url(#sc-card)" stroke="#26334d" stroke-width="1"/>
    <rect x="16" y="16" width="248" height="34" rx="6" fill="#3758f9" fill-opacity="0.12" stroke="#3758f9" stroke-opacity="0.3"/>
    <text x="28" y="38" fill="#60a5fa" font-size="13" font-weight="700">2. Repo-Centric</text>
    <rect x="168" y="23" width="88" height="20" rx="10" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="212" y="37" fill="#60a5fa" font-size="10.5" font-weight="600" text-anchor="middle">Multi-Repo</text>

    <!-- Tree View -->
    <g transform="translate(20, 68)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <rect x="0" y="0" width="240" height="215" rx="8" fill="#0b0f17" stroke="#1f2937" stroke-width="1"/>
      
      <text x="16" y="26" fill="#cbd5e1">projects/my-app/</text>
      <path d="M 24 34 L 24 175" stroke="#334155" stroke-width="1.2" fill="none"/>

      <path d="M 24 50 L 40 50" stroke="#334155" stroke-width="1.2"/>
      <circle cx="48" cy="50" r="3.5" fill="#3b82f6"/>
      <text x="58" y="54" fill="#38bdf8" font-weight="600">.git/</text>
      <text x="96" y="54" fill="#64748b" font-size="10">(repo root)</text>

      <path d="M 24 90 L 40 90" stroke="#334155" stroke-width="1.2"/>
      <circle cx="48" cy="90" r="3.5" fill="#6366f1"/>
      <text x="58" y="94" fill="#e2e8f0">main/</text>
      <text x="104" y="94" fill="#64748b" font-size="10">(primary tree)</text>

      <path d="M 24 135 L 40 135" stroke="#334155" stroke-width="1.2"/>
      <circle cx="48" cy="135" r="3.5" fill="#a855f7"/>
      <text x="58" y="139" fill="#c084fc" font-weight="600">worktrees/</text>
      
      <path d="M 64 146 L 64 195" stroke="#475569" stroke-width="1" fill="none"/>
      <path d="M 64 165 L 76 165" stroke="#475569" stroke-width="1"/>
      <text x="84" y="169" fill="#e2e8f0" font-size="11">feature-auth/</text>

      <path d="M 64 195 L 76 195" stroke="#475569" stroke-width="1"/>
      <text x="84" y="199" fill="#e2e8f0" font-size="11">bugfix-pay/</text>
    </g>

    <!-- Pros & Cons Badge -->
    <g transform="translate(20, 298)">
      <text x="0" y="16" fill="#4ade80" font-size="11" font-weight="600">✓ Isolated within one project</text>
      <text x="0" y="36" fill="#4ade80" font-size="11" font-weight="600">✓ Clean workspace boundary</text>
      <text x="0" y="56" fill="#f87171" font-size="11" font-weight="500">✗ Gitignore subfolder caution</text>
    </g>
  </g>

  <!-- Card 3: Branch-Type / Category -->
  <g transform="translate(648, 72)">
    <rect width="280" height="376" rx="12" fill="url(#sc-card)" stroke="#26334d" stroke-width="1"/>
    <rect x="16" y="16" width="248" height="34" rx="6" fill="#3758f9" fill-opacity="0.12" stroke="#3758f9" stroke-opacity="0.3"/>
    <text x="28" y="38" fill="#60a5fa" font-size="13" font-weight="700">3. Branch-Type</text>
    <rect x="176" y="23" width="80" height="20" rx="10" fill="#a855f7" fill-opacity="0.15"/>
    <text x="216" y="37" fill="#c084fc" font-size="10.5" font-weight="600" text-anchor="middle">GitFlow</text>

    <!-- Tree View -->
    <g transform="translate(20, 68)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <rect x="0" y="0" width="240" height="215" rx="8" fill="#0b0f17" stroke="#1f2937" stroke-width="1"/>
      
      <text x="16" y="24" fill="#cbd5e1">worktrees/my-app/</text>
      <path d="M 24 32 L 24 190" stroke="#334155" stroke-width="1.2" fill="none"/>

      <path d="M 24 48 L 40 48" stroke="#334155" stroke-width="1.2"/>
      <text x="48" y="52" fill="#a855f7" font-weight="600">features/</text>
      <path d="M 52 58 L 52 82" stroke="#475569" stroke-width="1" fill="none"/>
      <path d="M 52 74 L 64 74" stroke="#475569" stroke-width="1"/>
      <text x="70" y="78" fill="#e2e8f0" font-size="11">auth-oauth/</text>

      <path d="M 24 105 L 40 105" stroke="#334155" stroke-width="1.2"/>
      <text x="48" y="109" fill="#f59e0b" font-weight="600">bugfixes/</text>
      <path d="M 52 115 L 52 140" stroke="#475569" stroke-width="1" fill="none"/>
      <path d="M 52 132 L 64 132" stroke="#475569" stroke-width="1"/>
      <text x="70" y="136" fill="#e2e8f0" font-size="11">pay-gateway/</text>

      <path d="M 24 165 L 40 165" stroke="#334155" stroke-width="1.2"/>
      <text x="48" y="169" fill="#ef4444" font-weight="600">hotfixes/</text>
      <path d="M 52 175 L 52 195" stroke="#475569" stroke-width="1" fill="none"/>
      <path d="M 52 192 L 64 192" stroke="#475569" stroke-width="1"/>
      <text x="70" y="196" fill="#e2e8f0" font-size="11">prod-memory/</text>
    </g>

    <!-- Pros & Cons Badge -->
    <g transform="translate(20, 298)">
      <text x="0" y="16" fill="#4ade80" font-size="11" font-weight="600">✓ Matches branch naming</text>
      <text x="0" y="36" fill="#4ade80" font-size="11" font-weight="600">✓ Organized by purpose</text>
      <text x="0" y="56" fill="#f87171" font-size="11" font-weight="500">✗ Slightly deeper filepaths</text>
    </g>
  </g>
</svg>
